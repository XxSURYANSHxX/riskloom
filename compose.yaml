services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RISKLOOM_POSTGRES_DB:-riskloom}
      POSTGRES_USER: ${RISKLOOM_POSTGRES_USER:-riskloom}
      POSTGRES_PASSWORD: ${RISKLOOM_POSTGRES_PASSWORD:-riskloom_local_only}
    ports:
      - "127.0.0.1:${RISKLOOM_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    stop_grace_period: 10s
    volumes:
      - riskloom-postgres-data:/var/lib/postgresql/data

volumes:
  riskloom-postgres-data:
